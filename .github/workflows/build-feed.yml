name: Merchant feed daily build

on:
  # GO-LIVE STEP 1 of 2: uncomment the schedule block below once Daniel says
  # go. Left out deliberately for now -- see README "Go-live checklist". A
  # schedule trigger starts running the moment this file lands on the
  # default branch, whether or not the required secrets exist yet, so it
  # stays commented out rather than "present but expected to fail" to avoid
  # noisy failure notifications before this is actually meant to run.
  #
  # schedule:
  #   - cron: "0 6 * * *"  # 06:00 UTC daily, after cerda-sync's 05:00 UTC run
  workflow_dispatch: {}  # manual trigger only, for now

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v

      - name: Build feed from live Shopify data
        env:
          SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
        run: python build_feed.py --source shopify-api --out google_merchant_feed

      - name: Upload feed + report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feed-build-${{ github.run_number }}
          path: |
            data/
            reports/

      - name: Commit feed, exclusions log, and report back to repo
        if: always()
        run: |
          git config user.name "merchant-feed-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ reports/
          git diff --staged --quiet || git commit -m "Feed build ${{ github.run_id }}"
          git push

name: Merchant feed daily build

on:
  schedule:
    - cron: "0 6 * * *"  # 06:00 UTC daily, after cerda-sync's 05:00 UTC run
  workflow_dispatch: {}  # also runnable manually from the Actions tab

# Shared with build-idealo-feed.yml so the two never commit+push to master at
# the same time -- without this, a manual dispatch of both (or a slow run
# overlapping the next day's schedule) can have one workflow's push rejected
# because the other landed first, even though its own feed build succeeded.
concurrency:
  group: merchant-feed-sync-repo-push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v

      - name: Build feed from live Shopify data
        env:
          SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
        run: python build_feed.py --source shopify-api --out google_merchant_feed

      - name: Build Belgium (French) feed from live Shopify data
        env:
          SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
        run: python build_feed.py --source shopify-api --market be-fr --out google_merchant_feed_be_fr

      - name: Build Belgium (Dutch) feed from live Shopify data
        env:
          SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
        run: python build_feed.py --source shopify-api --market be-nl --out google_merchant_feed_be_nl

      - name: Build English feed from live Shopify data
        env:
          SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
        run: python build_feed.py --source shopify-api --market en --out google_merchant_feed_en

      - name: Upload feed + report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feed-build-${{ github.run_number }}
          path: |
            data/
            reports/

      - name: Commit feed, exclusions log, and report back to repo
        if: always()
        run: |
          git config user.name "merchant-feed-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ reports/
          git diff --staged --quiet && exit 0
          git commit -m "Feed build ${{ github.run_id }}"
          # Belt-and-braces alongside the concurrency group above: retry with
          # a rebase onto whatever landed on master in between, in case of a
          # push from outside this workflow pair (e.g. a manual commit).
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt/5) -- rebasing onto latest master and retrying"
            git pull --rebase
          done
          echo "::error::git push failed after 5 rebase+retry attempts"
          exit 1

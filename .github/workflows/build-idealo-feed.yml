name: idealo feed daily build

on:
  # Runs right after "Merchant feed daily build" succeeds (whatever started it: dispatch, cron or manual) -- separate
  # job, separate failure domain. The cron is a fallback only, off the hour (see build-feed.yml).
  workflow_run:
    workflows: ["Merchant feed daily build"]
    types: [completed]
    branches: [master]
  schedule:
    - cron: "17 5 * * *"  # fallback only, 05:17 UTC
  workflow_dispatch: {}  # also runnable manually from the Actions tab

# Shared with build-feed.yml so the two never commit+push to master at the
# same time -- without this, a manual dispatch of both (or a slow run
# overlapping the next day's schedule) can have one workflow's push rejected
# because the other landed first, even though its own feed build succeeded.
concurrency:
  group: merchant-feed-sync-repo-push

jobs:
  build:
    # For workflow_run, only continue when the feed build it follows succeeded; schedule/dispatch always run.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v

      - name: Build idealo feed from live Shopify data
        env:
          SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
        run: python idealo_feed.py --source shopify-api --market de

      - name: Upload feed + report as artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: idealo-feed-build-${{ github.run_number }}
          path: |
            data/idealo_feed.csv
            data/idealo_feed_exclusions.csv
            reports/*_idealo.md

      - name: Commit idealo feed and report back to repo
        if: always()
        run: |
          git config user.name "merchant-feed-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/idealo_feed.csv data/idealo_feed_exclusions.csv reports/*_idealo.md
          git diff --staged --quiet && exit 0
          git commit -m "idealo feed build ${{ github.run_id }}"
          # Belt-and-braces alongside the concurrency group above: retry with
          # a rebase onto whatever landed on master in between, in case of a
          # push from outside this workflow pair (e.g. a manual commit).
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt/5) -- rebasing onto latest master and retrying"
            git pull --rebase
          done
          echo "::error::git push failed after 5 rebase+retry attempts"
          exit 1
